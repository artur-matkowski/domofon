# Desktop Head Unit profile for a VW Passat B8 (2022 facelift) with the premium
# factory pack — the 9.2" "Discover Pro" (MIB2.5) head unit.
#
# That panel is 1280x640 (2:1). The DHU cannot render an arbitrary size — it only
# accepts 800x480 / 1280x720 / 1920x1080 and reverts to 800x480 for anything else —
# so we take the 1280x720 buffer and letterbox 80px of height away (720 - 80 = 640),
# the same trick the bundled default_wide.ini uses for wide-and-short head units.
# The app then lays out against the exact 1280x640 canvas the car gives it.
#
# dpi: 1280x640 across a 9.2" diagonal is ~155 dpi → the 160 (mdpi) bucket, which is
# also what the real unit reports. Touch only: Discover Pro is a capacitive
# touchscreen with no rotary controller or touchpad.
#
# Use it via scripts/dhu.sh (which passes it with -c automatically), or directly:
#   desktop-head-unit -c scripts/passat-b8.ini

[general]
touch = true
touchpad = false
controller = false
instrumentcluster = false
resolution = 1280x720
marginheight = 80
dpi = 160
framerate = 30

[sensors]
location = true
night_mode = true
driving_status = true
