# Desktop Head Unit profile for a VW Passat B8 (2022 facelift) with the premium
# factory pack — the 9.2" "Discover Pro" (MIB2.5) head unit.
#
# Aspect ratio is the lever, not dpi. At the panel's native 2:1 the DHU renders Android
# Auto's Coolwalk two-pane widescreen layout — a left app rail with the media + map
# dashboard side by side — which the real car does not show. A narrower 5:3 aspect keeps
# Android Auto in its single-app layout; dpi stays native 160.
#
# The DHU only accepts 800x480 / 1280x720 / 1920x1080 as base resolutions. 1280x720 is
# 16:9, so we crop 80px of width (marginwidth subtracts total pixels) to land on exactly
# 1200x720 = 5:3 — higher resolution than the plain 800x480 5:3 base. To push higher at the
# same aspect, use the 1920x1080 base with marginwidth 120 -> 1800x1080.
#
# Caveat: at dpi 160 this is 1200 dp wide vs the 800 dp that was confirmed single-pane. If
# tiling returns here, the trigger is dp width rather than aspect, and a higher-res single
# pane would need the dpi lever after all — worth a conversation at that point. Touch only:
# Discover Pro is a capacitive touchscreen with no rotary controller or touchpad.
#
# Use it via scripts/dhu.sh (which passes it with -c automatically), or directly:
#   desktop-head-unit -c scripts/passat-b8.ini

[general]
touch = true
touchpad = false
controller = false
instrumentcluster = false
resolution = 1280x720
marginwidth = 80
dpi = 160
framerate = 30

[sensors]
location = true
night_mode = true
driving_status = true
