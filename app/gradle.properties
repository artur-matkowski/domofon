org.gradle.jvmargs=-Xmx3200m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# --- Memory ceilings ----------------------------------------------------------------
# Added after a release build froze the machine on 2026-07-24 (docs/10 -> "Build machine /
# host resources"). org.gradle.jvmargs above is deliberately NOT lowered: the daemon log
# reports "heap usage: 3% of 3.1 GiB" at build *start*, which says nothing about R8's peak,
# and shrinking it blindly would trade a desktop freeze for a build-time OOM. The real
# safety net is the cgroup cap in scripts/lib/memguard.sh; these three just stop the build
# from claiming more than it needs.

# The Kotlin compile daemon is a second JVM and inherits org.gradle.jvmargs unless it is
# pinned — i.e. two 3.2 GB ceilings where one was intended.
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# 12 cores here, so the default would allow up to 12 concurrent dex/R8 workers.
org.gradle.workers.max=6

# Gradle's default is 10800000 ms (3 h) — confirmed in the daemon context line. That is
# what let a 3.1 GiB worker daemon sit on this machine for 2h45m on 2026-07-24 while
# Gradle logged "0 released" every 5 seconds, 3474 times. The build scripts pass
# --no-daemon so they are immune, but Android Studio and a bare ./gradlew are not.
org.gradle.daemon.idletimeout=1800000

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Qt Gradle Plugin ---------------------------------------------------------
# The QtBuild {} DSL is deprecated since plugin 1.3; configure via properties.
# qtProjectPath is resolved relative to the ROOT project directory (this file's
# directory) — NOT relative to the app module. The deprecated DSL was module-relative,
# which is why copied examples break in confusing ways.
qtProjectPath=qtquickview

# qtPath is machine-specific, so it lives in local.properties (gitignored).
# See local.properties.example.
