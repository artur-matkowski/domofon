org.gradle.jvmargs=-Xmx3200m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Qt Gradle Plugin ---------------------------------------------------------
# The QtBuild {} DSL is deprecated since plugin 1.3; configure via properties.
# qtProjectPath is resolved relative to the ROOT project directory (this file's
# directory) — NOT relative to the app module. The deprecated DSL was module-relative,
# which is why copied examples break in confusing ways.
qtProjectPath=qtquickview

# qtPath is machine-specific, so it lives in local.properties (gitignored).
# See local.properties.example.
